global:
  scrape_interval: 5s
  evaluation_interval: 5s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: obagent-monitor-basic
    metrics_path: /metrics/ob/basic
    static_configs:
      - targets: ["observer:8088"]
  - job_name: obagent-monitor-extra
    metrics_path: /metrics/ob/extra
    static_configs:
      - targets: ["observer:8088"]
