# Linux AMD64 quickstart. No .env file, local build or preparation script required.
name: ${COMPOSE_PROJECT_NAME:-oceanseek}

# IMAGE_REGISTRY is an optional registry/namespace prefix, without a trailing slash.
# A complete per-image reference always takes precedence (including @sha256 digests).
x-bootstrap-image: &bootstrap-image ${BOOTSTRAP_IMAGE:-${IMAGE_REGISTRY:-${OCEANBASE_IMAGE_REGISTRY:-quay.io/oceanbase}}/oceanseek-bootstrap:0.1.0}
x-logservice: &logservice
  image: ${LOGSERVICE_IMAGE:-${IMAGE_REGISTRY:-${OCEANBASE_IMAGE_REGISTRY:-quay.io/oceanbase}}/logservice:1.3.3-152026112014}
  platform: linux/amd64
  entrypoint: ["/opt/oceanseek/logservice-entrypoint.sh"]
  restart: unless-stopped
  cpus: ${LOGSERVICE_CPUS:-2}
  mem_limit: ${LOGSERVICE_CONTAINER_MEMORY:-4g}
  stop_grace_period: 60s
  healthcheck:
    test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/50052"]
    interval: 5s
    timeout: 3s
    retries: 120
  logging: &bounded-logging
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

x-logservice-env: &logservice-env
  TZ: Asia/Shanghai
  CLUSTER_ID: ${LOGSERVICE_CLUSTER_ID:-10002}
  LOG_DISK_SIZE: ${LOGSERVICE_LOG_DISK_SIZE:-9G}
  MEMORY_LIMIT: ${LOGSERVICE_MEMORY_LIMIT:-3686M}

services:
  credentials-init:
    image: *bootstrap-image
    command: ["--mode", "credentials"]
    user: "0:0"
    restart: "no"
    network_mode: none
    volumes:
      - credentials:/run/secrets
    logging: *bounded-logging

  host-info-init:
    image: *bootstrap-image
    entrypoint: ["/opt/oceanseek/host-info-init.sh"]
    user: "0:0"
    restart: "no"
    network_mode: host
    environment:
      HOST_ACCESS_IP: ${HOST_ACCESS_IP:-}
    volumes:
      - credentials:/run/secrets
      - ./scripts:/opt/oceanseek:ro,z
    depends_on:
      credentials-init: {condition: service_completed_successfully}
    logging: *bounded-logging

  minio:
    image: ${MINIO_IMAGE:-${IMAGE_REGISTRY:-${OCEANBASE_IMAGE_REGISTRY:-quay.io/oceanbase}}/minio:RELEASE.2025-10-15T17-29-55Z}
    entrypoint: ["/opt/oceanseek/minio-entrypoint.sh"]
    user: "0:0"
    restart: unless-stopped
    mem_limit: ${MINIO_MEMORY:-1g}
    volumes:
      - minio-data:/data
      - credentials:/run/secrets:ro
      - ./scripts:/opt/oceanseek:ro,z
    depends_on:
      credentials-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks:
      oceanseek:
        ipv4_address: ${MINIO_IP:-198.18.52.10}
    logging: *bounded-logging

  minio-init:
    image: ${MINIO_MC_IMAGE:-${IMAGE_REGISTRY:-${OCEANBASE_IMAGE_REGISTRY:-quay.io/oceanbase}}/mc:RELEASE.2025-08-13T08-35-41Z}
    entrypoint: ["/opt/oceanseek/minio-init.sh"]
    user: "0:0"
    restart: "no"
    environment:
      LOGSERVICE_BUCKET: ${LOGSERVICE_BUCKET:-oceanseek-logservice}
      SHARED_STORAGE_BUCKET: ${SHARED_STORAGE_BUCKET:-oceanseek-data}
    volumes:
      - ./scripts:/opt/oceanseek:ro,z
      - credentials:/run/secrets:ro
    depends_on:
      minio: {condition: service_healthy}
    networks: [oceanseek]
    logging: *bounded-logging

  logservice-1:
    <<: *logservice
    environment:
      <<: *logservice-env
      LOCAL_IP: ${LOGSERVICE_IP_1:-198.18.52.11}
    volumes:
      - logservice-1-store:/home/admin/oblogservice/store
      - logservice-1-log:/home/admin/oblogservice/log
      - ./scripts:/opt/oceanseek:ro,z
    networks:
      oceanseek:
        ipv4_address: ${LOGSERVICE_IP_1:-198.18.52.11}

  logservice-2:
    <<: *logservice
    environment:
      <<: *logservice-env
      LOCAL_IP: ${LOGSERVICE_IP_2:-198.18.52.12}
    volumes:
      - logservice-2-store:/home/admin/oblogservice/store
      - logservice-2-log:/home/admin/oblogservice/log
      - ./scripts:/opt/oceanseek:ro,z
    networks:
      oceanseek:
        ipv4_address: ${LOGSERVICE_IP_2:-198.18.52.12}

  logservice-3:
    <<: *logservice
    environment:
      <<: *logservice-env
      LOCAL_IP: ${LOGSERVICE_IP_3:-198.18.52.13}
    volumes:
      - logservice-3-store:/home/admin/oblogservice/store
      - logservice-3-log:/home/admin/oblogservice/log
      - ./scripts:/opt/oceanseek:ro,z
    networks:
      oceanseek:
        ipv4_address: ${LOGSERVICE_IP_3:-198.18.52.13}

  logservice-bootstrap:
    image: ${LOGSERVICE_IMAGE:-${IMAGE_REGISTRY:-${OCEANBASE_IMAGE_REGISTRY:-quay.io/oceanbase}}/logservice:1.3.3-152026112014}
    platform: linux/amd64
    entrypoint: ["/opt/oceanseek/logservice-bootstrap.sh"]
    user: "0:0"
    restart: "no"
    environment:
      LOGSERVICE_CLUSTER_ID: ${LOGSERVICE_CLUSTER_ID:-10002}
      TZ: Asia/Shanghai
      LOGSERVICE_IP_1: ${LOGSERVICE_IP_1:-198.18.52.11}
      LOGSERVICE_IP_2: ${LOGSERVICE_IP_2:-198.18.52.12}
      LOGSERVICE_IP_3: ${LOGSERVICE_IP_3:-198.18.52.13}
      LOGSERVICE_BUCKET_URL: s3://${LOGSERVICE_BUCKET:-oceanseek-logservice}?host=http://${MINIO_IP:-198.18.52.10}:9000&s3_region=${S3_REGION:-us-east-1}
      REGION_NAME: ${REGION_NAME:-region1}
      ZONE_NAME_1: ${ZONE_NAME:-zone1}-1
      ZONE_NAME_2: ${ZONE_NAME:-zone1}-2
      ZONE_NAME_3: ${ZONE_NAME:-zone1}-3
    volumes:
      - ./scripts:/opt/oceanseek:ro,z
      - credentials:/run/secrets:ro
    depends_on:
      minio-init: {condition: service_completed_successfully}
      logservice-1: {condition: service_healthy}
      logservice-2: {condition: service_healthy}
      logservice-3: {condition: service_healthy}
    networks: [oceanseek]
    logging: *bounded-logging

  observer:
    image: ${OBSERVER_IMAGE:-${IMAGE_REGISTRY:-${OCEANBASE_IMAGE_REGISTRY:-quay.io/oceanbase}}/oceanseek:4.6.3.0-482026112114}
    platform: linux/amd64
    entrypoint: ["/opt/oceanseek/observer-entrypoint.sh"]
    restart: unless-stopped
    cpus: ${OBSERVER_CPUS:-3}
    mem_limit: ${OBSERVER_CONTAINER_MEMORY:-10g}
    stop_grace_period: 90s
    environment:
      CLUSTER_NAME: ${CLUSTER_NAME:-oceanseek-compose}
      TZ: Asia/Shanghai
      CLUSTER_ID: ${OBSERVER_CLUSTER_ID:-10001}
      ZONE_NAME: ${ZONE_NAME:-zone1}
      LOCAL_IP: ${OBSERVER_IP:-198.18.52.21}
      AUTO_REGISTER_MONITORING: ${AUTO_REGISTER_MONITORING:-true}
      PROMETHEUS_INTERNAL_URL: ${PROMETHEUS_INTERNAL_URL:-http://prometheus:9090/}
      ALERTMANAGER_INTERNAL_URL: ${ALERTMANAGER_INTERNAL_URL:-http://alertmanager:9093}
      MONITORING_REGISTER_TIMEOUT_SECONDS: ${MONITORING_REGISTER_TIMEOUT_SECONDS:-600}
      CPU_COUNT: ${OBSERVER_CPU_COUNT:-3}
      DATAFILE_SIZE: ${OBSERVER_DATAFILE_SIZE:-10G}
      DATAFILE_MAXSIZE: ${OBSERVER_DATAFILE_MAXSIZE:-38G}
      DATAFILE_NEXT: ${OBSERVER_DATAFILE_NEXT:-4G}
      MEMORY_LIMIT: ${OBSERVER_MEMORY_LIMIT:-9G}
    volumes:
      - observer-data:/home/admin/data-file
      - observer-log:/home/admin/log
      - credentials:/run/secrets:ro
      - ./scripts:/opt/oceanseek:ro,z
    ports:
      - "${OBSERVER_SQL_BIND_ADDRESS:-0.0.0.0}:${OBSERVER_SQL_HOST_PORT:-32881}:2881"
      - "${OBSHELL_BIND_ADDRESS:-0.0.0.0}:${OBSHELL_HOST_PORT:-32886}:2886"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/2881 && exec 4<>/dev/tcp/127.0.0.1/2886"]
      interval: 5s
      timeout: 3s
      retries: 180
    depends_on:
      logservice-bootstrap: {condition: service_completed_successfully}
    networks:
      oceanseek:
        ipv4_address: ${OBSERVER_IP:-198.18.52.21}
    logging: *bounded-logging

  observer-bootstrap:
    image: *bootstrap-image
    user: "0:0"
    entrypoint: ["/opt/oceanseek/observer-bootstrap.sh"]
    restart: "no"
    environment:
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-oceanseek}
      MINIO_IP: ${MINIO_IP:-198.18.52.10}
      OBSERVER_HOST: ${OBSERVER_IP:-198.18.52.21}
      OBSERVER_SQL_PORT: "2881"
      OBSERVER_RPC_PORT: "2882"
      ZONE_NAME: ${ZONE_NAME:-zone1}
      LOGSERVICE_CLUSTER_ID: ${LOGSERVICE_CLUSTER_ID:-10002}
      LOGSERVICE_BUCKET_URL: s3://${LOGSERVICE_BUCKET:-oceanseek-logservice}?host=http://${MINIO_IP:-198.18.52.10}:9000&s3_region=${S3_REGION:-us-east-1}
      SHARED_STORAGE_BUCKET_URL: s3://${SHARED_STORAGE_BUCKET:-oceanseek-data}?host=http://${MINIO_IP:-198.18.52.10}:9000&s3_region=${S3_REGION:-us-east-1}
      BOOTSTRAP_TIMEOUT: ${BOOTSTRAP_TIMEOUT:-30m}
      ALLOW_LEGACY_EMPTY_ROOT: ${ALLOW_LEGACY_EMPTY_ROOT:-false}
      OBSERVER_SQL_HOST_PORT: ${OBSERVER_SQL_HOST_PORT:-32881}
      OBSHELL_HOST_PORT: ${OBSHELL_HOST_PORT:-32886}
      PROMETHEUS_HOST_PORT: ${PROMETHEUS_HOST_PORT:-39090}
      ALERTMANAGER_HOST_PORT: ${ALERTMANAGER_HOST_PORT:-39093}
    volumes:
      - credentials:/run/secrets
      - ./scripts:/opt/oceanseek:ro,z
    depends_on:
      observer: {condition: service_healthy}
      host-info-init: {condition: service_completed_successfully}
    networks: [oceanseek]
    logging: *bounded-logging

  obagent:
    image: ${OBAGENT_IMAGE:-${IMAGE_REGISTRY:-${OCEANBASE_IMAGE_REGISTRY:-quay.io/oceanbase}}/obagent:4.2.6-100000152026051118}
    platform: linux/amd64
    networks: [oceanseek]
    entrypoint: ["/opt/oceanseek/obagent-entrypoint.sh"]
    restart: unless-stopped
    cpus: ${OBAGENT_CPUS:-0.5}
    mem_limit: ${OBAGENT_MEMORY:-512m}
    environment:
      HOST_IP: ${OBSERVER_IP:-198.18.52.21}
      CLUSTER_ID: ${OBSERVER_CLUSTER_ID:-10001}
      CLUSTER_NAME: ${CLUSTER_NAME:-oceanseek-compose}
      ZONE_NAME: ${ZONE_NAME:-zone1}
      MONITOR_USER: monitor
    volumes:
      - credentials:/run/secrets:ro
      - ./scripts:/opt/oceanseek:ro,z
    depends_on:
      observer-bootstrap: {condition: service_completed_successfully}
    healthcheck:
      test:
        - CMD
        - bash
        - -eo
        - pipefail
        - -c
        - |
          exec 3<>/dev/tcp/observer/2881
          curl -fsS http://obagent:8088/metrics/ob/basic | grep '^ob_sysstat{' >/dev/null
      interval: 5s
      timeout: 3s
      start_period: 5m
      retries: 3
    logging: *bounded-logging

  alertmanager:
    image: ${ALERTMANAGER_IMAGE:-${IMAGE_REGISTRY:-quay.io/prometheus}/alertmanager:v0.27.0}
    platform: linux/amd64
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro,z
      - alertmanager-data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9093/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [oceanseek]
    logging: *bounded-logging

  prometheus:
    image: ${PROMETHEUS_IMAGE:-${IMAGE_REGISTRY:-quay.io/prometheus}/prometheus:v2.51.1}
    platform: linux/amd64
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus-data:/prometheus
    depends_on:
      obagent: {condition: service_healthy, restart: true}
      alertmanager: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 60
    networks: [oceanseek]
    logging: *bounded-logging

volumes:
  credentials:
  minio-data:
  logservice-1-store:
  logservice-1-log:
  logservice-2-store:
  logservice-2-log:
  logservice-3-store:
  logservice-3-log:
  observer-data:
  observer-log:
  prometheus-data:
  alertmanager-data:

networks:
  oceanseek:
    ipam:
      config:
        - subnet: ${COMPOSE_SUBNET:-198.18.52.0/24}
