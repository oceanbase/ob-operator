initCredentials: true
# Initial admin password; existing accounts are preserved on upgrade.
adminPassword: admin

# Empty uses quay.io/oceanbase/oceanbase-dashboard:<Chart appVersion>.
image: ""
# Keep account, authorization and volume data when removing the dashboard.
retainData: false
rbac:
  # Avoid cluster-scoped name collisions between equal releases in namespaces.
  includeNamespace: false
serviceAccount:
  # Embedded charts can create the same <release>-sa with inherited pull secrets.
  create: true

userCredentials: 
userNamespace: 
configNamespace: 

nodeSelector: {}
tolerations: []

service:
  # Empty lets Kubernetes allocate an available port.
  nodePort: null
  type: NodePort
  port: 80

prometheus:
  persistence:
    enabled: true
    create: true
    existingClaim: ""
    storageClassName: ""
    accessMode: ReadWriteOnce
    storage: 8Gi

sharedVolume:
  persistence:
    enabled: true
    create: true
    existingClaim: ""
    storageClassName: ""
    accessMode: ReadWriteOnce
    storage: 10Gi

cleanup:
  enabled: true
  schedule: "0 * * * *"
  retentionMinutes: 60
  ttlSecondsAfterFinished: 60

inspection:
  obdiag:
    image: "oceanbase/obdiag:latest"
  oceanbaseHelper:
    image: "oceanbase/oceanbase-helper:latest"

job:
  inspection:
    ttlSecondsAfterFinished: 86400 # 1 day
  normal:
    ttlSecondsAfterFinished: 300 # 5 minutes

sqlAnalyzer:
  image: "quay.io/oceanbase/sql-analyzer:0.1.0"
  retentionDays: 7
  storageSize: 20Gi
  collectionIntervalSeconds: 30
  compactionIntervalSeconds: 3600
  cpuRequest: "100m"
  cpuLimit: "2"
  memoryRequest: "128Mi"
  memoryLimit: "4Gi"
  sqlAuditLimit: 10000
  slowSqlThresholdMilliSeconds: 1000

