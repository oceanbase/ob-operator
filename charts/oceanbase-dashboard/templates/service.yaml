{{- $nodePort := int (.Values.service.nodePort | default 0) -}}
{{- if not $nodePort -}}
{{- $service := lookup "v1" "Service" .Release.Namespace (printf "oceanbase-dashboard-%s" .Release.Name) -}}
{{- if and $service $service.spec.ports -}}{{- $nodePort = int ((index $service.spec.ports 0).nodePort | default 0) -}}{{- end -}}
{{- end -}}
apiVersion: v1
kind: Service
metadata:
  name: oceanbase-dashboard-{{ .Release.Name }}
  labels:
    {{- include "oceanbase-dashboard.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type | default "NodePort" }}
  ports:
    - port: {{ .Values.service.port | default 80 }}
      {{- if and $nodePort (has (.Values.service.type | default "NodePort") (list "NodePort" "LoadBalancer")) }}
      nodePort: {{ $nodePort }}
      {{- end }}
      targetPort: 8080
      protocol: TCP
      name: dashboard-backend
  selector:
    app: oceanbase-dashboard-{{ .Release.Name }}
