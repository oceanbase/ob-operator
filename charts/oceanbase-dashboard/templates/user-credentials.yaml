{{- if .Values.initCredentials }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-user-credentials" .Release.Name) }}
{{- $initialName := printf "%s-dashboard-bootstrap" .Release.Name }}
{{- $initial := lookup "v1" "Secret" .Release.Namespace $initialName }}
{{- $password := "" }}
{{- if and $initial (not $existing) }}
  {{- fail (printf "restore Dashboard account Secret %s-user-credentials before continuing; the bootstrap password cannot recover current accounts" .Release.Name) }}
{{- end }}
{{- if $initial }}
  {{- $password = required "Dashboard bootstrap Secret is missing the initial password" $initial.data.password | b64dec }}
{{- else if not $existing }}
  {{- $password = .Values.adminPassword | default (randAlphaNum 32) }}
{{- end }}
{{- if or $initial (and (not $existing) (not .Values.adminPassword)) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $initialName }}
  namespace: {{ .Release.Namespace }}
  {{- if .Values.retainData }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "oceanbase-dashboard.labels" . | nindent 4 }}
type: Opaque
data:
  password: {{ $password | b64enc | quote }}
---
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-user-credentials
  namespace: {{ .Release.Namespace }}
  {{- if .Values.retainData }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "oceanbase-dashboard.labels" . | nindent 4 }}
data:
    {{- if not $existing }}
  admin: {{ cat (sha256sum $password) "<|:SEP:|> admin <|:SEP:|> 0 <|:SEP:|> super admin" | b64enc }}
    {{- else }}
  {{- toYaml $existing.data | nindent 2 }}
    {{- end }}
{{- end }}
