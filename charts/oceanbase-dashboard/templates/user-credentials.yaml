{{- if .Values.initCredentials }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (printf "%s-user-credentials" .Release.Name) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-user-credentials
  namespace: {{ .Release.Namespace }}
  {{- if .Values.retainData }}
  annotations:
    helm.sh/resource-policy: keep
  {{- end }}
  labels:
    {{- include "oceanbase-dashboard.labels" . | nindent 4 }}
data:
    {{- if not $existing }}
  admin: {{ cat (sha256sum (.Values.adminPassword | default ("admin"))) "<|:SEP:|> admin <|:SEP:|> 0 <|:SEP:|> super admin" | b64enc }}
    {{- else }}
  {{- toYaml $existing.data | nindent 2 }}
    {{- end }}
{{- end }}
