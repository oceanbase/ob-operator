{{- if .Values.lakehouse.enabled }}
{{- if not .Values.lakehouse.observerImage }}
{{- fail "lakehouse.observerImage is required when lakehouse.enabled is true" }}
{{- end }}
{{- if not .Values.lakehouse.logService.image }}
{{- fail "lakehouse.logService.image is required when lakehouse.enabled is true" }}
{{- end }}
{{- if not .Values.lakehouse.logService.bucketURL }}
{{- fail "lakehouse.logService.bucketURL is required when lakehouse.enabled is true" }}
{{- end }}
{{- if not .Values.lakehouse.sharedStorage.bucketURL }}
{{- fail "lakehouse.sharedStorage.bucketURL is required when lakehouse.enabled is true" }}
{{- end }}
{{- $logServiceBucket := regexFind "^s3://[^/?]+" .Values.lakehouse.logService.bucketURL }}
{{- $sharedStorageBucket := regexFind "^s3://[^/?]+" .Values.lakehouse.sharedStorage.bucketURL }}
{{- if and $logServiceBucket $sharedStorageBucket (eq $logServiceBucket $sharedStorageBucket) }}
{{- fail "lakehouse.logService.bucketURL and lakehouse.sharedStorage.bucketURL must use different buckets" }}
{{- end }}
{{- if or (not $logServiceBucket) (not $sharedStorageBucket) }}
{{- fail "lakehouse bucket URLs must start with s3://<bucket>" }}
{{- end }}
{{- if not (regexFind "[?&]host=[^&]+" .Values.lakehouse.logService.bucketURL) }}
{{- fail "lakehouse.logService.bucketURL must contain a non-empty host parameter" }}
{{- end }}
{{- if not (regexFind "[?&]s3_region=[^&]+" .Values.lakehouse.sharedStorage.bucketURL) }}
{{- fail "lakehouse.sharedStorage.bucketURL must contain a non-empty s3_region parameter" }}
{{- end }}
{{- if not (regexFind "[?&]host=[^&]+" .Values.lakehouse.sharedStorage.bucketURL) }}
{{- fail "lakehouse.sharedStorage.bucketURL must contain a non-empty host parameter" }}
{{- end }}
{{- if not (regexFind "[?&]s3_region=[^&]+" .Values.lakehouse.logService.bucketURL) }}
{{- fail "lakehouse.logService.bucketURL must contain a non-empty s3_region parameter" }}
{{- end }}
{{- $logServiceSecret := .Values.lakehouse.logService.existingSecretName }}
{{- $sharedStorageSecret := .Values.lakehouse.sharedStorage.existingSecretName }}
{{- if or (not $logServiceSecret) (not $sharedStorageSecret) }}
{{- if not .Values.lakehouse.credentials.accessId }}
{{- fail "lakehouse.credentials.accessId is required when an S3 Secret is generated" }}
{{- end }}
{{- if not .Values.lakehouse.credentials.accessKey }}
{{- fail "lakehouse.credentials.accessKey is required when an S3 Secret is generated" }}
{{- end }}
{{- if not $logServiceSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oceanbase-cluster.logServiceSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "oceanbase-cluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  access_id: {{ .Values.lakehouse.credentials.accessId | quote }}
  access_key: {{ .Values.lakehouse.credentials.accessKey | quote }}
{{- end }}
{{- if not $sharedStorageSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "oceanbase-cluster.sharedStorageSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
  {{- include "oceanbase-cluster.labels" . | nindent 4 }}
type: Opaque
stringData:
  access_id: {{ .Values.lakehouse.credentials.accessId | quote }}
  access_key: {{ .Values.lakehouse.credentials.accessKey | quote }}
{{- end }}
{{- end }}
{{- end }}
