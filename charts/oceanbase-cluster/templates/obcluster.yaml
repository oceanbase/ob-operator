apiVersion: oceanbase.oceanbase.com/v1alpha1
kind: OBCluster
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
  {{- include "oceanbase-cluster.labels" . | nindent 4 }}
  annotations:
  {{- toYaml .Values.annotations | nindent 4 }}
spec:
  clusterName: {{ .Values.clusterName | default .Release.Name | quote }}
  clusterId: {{ .Values.clusterId | default (nospace (cat "1" (randNumeric 7))) }}
  {{- if .Values.lakehouse.enabled }}
  deploymentMode: shared_storage
  logServiceRef:
    name: {{ include "oceanbase-cluster.logServiceName" . }}
  sharedStorageInfo:
    bucketURL: {{ .Values.lakehouse.sharedStorage.bucketURL | quote }}
    secretRef:
      name: {{ include "oceanbase-cluster.sharedStorageSecretName" . }}
    {{- with .Values.lakehouse.sharedStorage.maxIOPS }}
    maxIOPS: {{ . | quote }}
    {{- end }}
    {{- with .Values.lakehouse.sharedStorage.maxBandwidth }}
    maxBandwidth: {{ . | quote }}
    {{- end }}
  {{- end }}
  serviceAccount: {{ .Values.serviceAccount | default "default" | quote }}
  userSecrets:
  {{- range $key, $value := .Values.userSecrets }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
  topology: 
    {{- toYaml .Values.topology | nindent 4 }}
  observer:
    {{- if .Values.lakehouse.enabled }}
    image: {{ .Values.lakehouse.observerImage | quote }}
    {{- else }}
    image: {{ .Values.observerImage | default (printf "oceanbase/oceanbase-cloud-native:%s" .Chart.AppVersion) | quote }}
    {{- end }}
    {{- with .Values.observerConfig }}
    resource:
      {{- toYaml .resource | nindent 6 }}
    storage:
     {{- range $key, $size := .storages }}
     {{- if and $.Values.lakehouse.enabled (eq $key "redoLogStorage") }}{{- else }}
      {{ $key }}:
        storageClass: {{ $.Values.storageClass }}
        size: {{ $size }}
     {{- end }}
     {{- end }}
    {{- end }}
  {{- if .Values.monitorEnabled }}
  monitor:
    image: oceanbase/obagent:{{ .Values.obAgentVersion }}
    resource:
      {{- toYaml .Values.monitorResource | nindent 6 }}
  {{- end }}
  parameters:
  {{- range $param := .Values.parameters }}
    - name: {{ $param.name }}
      value: {{ $param.value | quote }}
  {{- end }}
  {{- if .Values.backupVolumeEnabled }}
  backupVolume:
    volume: 
      name: backup
      {{- toYaml .Values.backupVolume | nindent 6 }}
  {{- end }}
