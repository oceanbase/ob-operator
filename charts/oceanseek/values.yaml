# See USAGE.txt for installation from a release or source checkout.
# helm upgrade --install oceanseek ./oceanseek -n oceanseek --create-namespace \
#   --wait --wait-for-jobs --timeout 35m
# Defaults match values-single-node.yaml: 1 Observer, 3 LogService processes,
# 1 OBProxy, bundled MinIO and Dashboard. Database + proxy request 10 CPU / 24Gi;
# add Kubernetes, monitoring and storage overhead, and >=350Gi free disk.
# The complete graph is declarative; Operator reconciles storage -> LS -> OB.
stage: cluster
native:
  enabled: true
  readiness:
    # Shared by the readiness Job and OBProxy discovery init container.
    executable: /oceanseek-readiness
    image: quay.io/oceanbase/ob-operator:2.4.0
    imagePullPolicy: IfNotPresent
    timeoutSeconds: 1800
    resources:
      requests: {cpu: 25m, memory: 32Mi}
      limits: {cpu: 100m, memory: 128Mi}
storageClass: local-path
imagePullSecrets: []

access:
  # Empty discovers a Ready node InternalIP (ExternalIP fallback) for printed URLs.
  # Set a reachable IP/DNS name for NAT, multiple NICs or restricted node-list RBAC.
  host: ""
sqlService:
  type: NodePort
  port: 2883 # SQL entry port; OBProxy listens on 2883, direct Observer on 2881.
  nodePort: 0 # Allocate a free port; preserve the existing port on upgrades.

# Resource defaults for the test environment profile.
# G/GB in that draft are expressed as Gi in Kubernetes; host overhead is extra.
# SQL clients use the same sqlService address with or without OBProxy.
obproxy:
  enabled: true
  image: quay.io/oceanbase/obproxy-ce:4.3.3.0-5
  imagePullPolicy: IfNotPresent
  replicas: 1
  # Keep the proxy process budget below its container memory limit.
  memoryLimit: 1536M
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "1", memory: 2Gi}
  nodeSelector: {}
  tolerations: []

# Dashboard, Prometheus and Alertmanager are installed in the SAME release.
# Set enabled=false if an existing shared Dashboard already manages this cluster.
dashboard:
  enabled: true
  image: quay.io/oceanbase/oceanbase-dashboard:0.7.0
  # Prometheus BusyBox (glibc), pinned to its multi-architecture image index.
  utilityImage: quay.io/prometheus/busybox@sha256:c78ea71d5da0a24559fdc3a5eb49c04223e28dd6c6570c754395326f66d50728
  inspection:
    obdiag:
      image: quay.io/oceanbase/obdiag:5.0.2-12026102116
    oceanbaseHelper:
      image: quay.io/oceanbase/oceanbase-helper:2.4.0
  # Utilities/monitoring can be mirrored using utilityImage, prometheus.image
  # and alertmanager.image. The release image-values file pins all of them,
  # including inspection.obdiag.image and inspection.oceanbaseHelper.image.
  # Empty generates a random initial password. Login as admin; change it in UI.
  # For a supplied initial password use --set-file dashboard.adminPassword=FILE.
  adminPassword: ""
  requirePasswordResetOnFirstLogin: false # The parent generates a random initial password.
  # The parent owns credentials/PVCs; keep these integration settings unchanged.
  initCredentials: false
  retainData: true
  userCredentials: ""
  userNamespace: ""
  configNamespace: ""
  rbac:
    includeNamespace: true
    createPolicy: false # OceanSeek seeds the policy without managing it in release history.
  serviceAccount:
    create: false # parent passes imagePullSecrets to this account
  nodeSelector: {}
  tolerations: []
  service:
    type: NodePort
    port: 80
    nodePort: 0 # Allocate a free port; preserve the existing port on upgrades.
  prometheus:
    persistence:
      enabled: true
      create: false
      existingClaim: ""
      storageClassName: "" # inherits the top-level storageClass
      accessMode: ReadWriteOnce
      storage: 8Gi
  sharedVolume:
    # Same SELinux level for Dashboard, diagnostic Jobs and cleanup.
    seLinuxLevel: s0
    persistence:
      enabled: true
      create: false
      existingClaim: ""
      storageClassName: "" # inherits the top-level storageClass
      accessMode: ReadWriteOnce
      storage: 10Gi

# Defaults for initialization Pods and every LogService/Observer zone. A topology entry
# may override nodeSelector keys to place that zone on a different worker.
scheduling:
  nodeSelector: {}
  tolerations: []

objectStorage:
  # Deprecated compatibility field; endpoint presence alone selects storage.
  mode: bundled
  # External HTTP service.namespace.svc[.cluster.local] endpoints are resolved to
  # a retained ClusterIP on NEW installs. Other DNS requires bucket.endpoint DNS.
  endpoint: "" # when nonempty, always used; http(s)://hostname[:port]
  region: us-east-1
  logBucket: "" # defaults to RELEASE-logs
  dataBucket: "" # defaults to RELEASE-data; bundled mode requires distinct buckets
  existingSecret: "" # external: shared fallback; keys access_id and access_key
  # External storage may use the same bucket and/or independent credentials.
  # Empty per-side references inherit existingSecret, preserving old installs.
  logExistingSecret: ""
  dataExistingSecret: ""
  # External mode is read-only by default. true explicitly permits bucket creation
  # using the supplied credentials; never changes users/policies/existing objects.
  createBuckets: false

minio:
  enabled: true # controls deployment only; an external endpoint still wins
  mode: standalone
  distributed:
    replicas: 3
    drivesPerNode: 1
    driveSize: 100Gi
  # Subchart settings are independent of the parent storageClass/scheduling.
  storageClass: local-path
  region: us-east-1
  nodeSelector: {}
  tolerations: []
  imagePullSecrets: []
  # No binary/image is included in this chart; kubelet pulls this image online.
  # Optional third-party software, independently licensed under AGPL-3.0.
  image: quay.io/oceanbase/minio:RELEASE.2025-10-15T17-29-55Z
  imagePullPolicy: IfNotPresent
  rootExistingSecret: "" # optional keys rootUser/rootPassword; otherwise generated
  existingClaim: "" # optional independently managed RWO claim
  # Use a dedicated non-root identity. UID/GID 1000 commonly belongs to a host
  # login account and may have an explicit ACL that overrides the PVC mode bits.
  # No root init/chown is performed; changing IDs does not migrate existing data.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  size: 100Gi
  resources:
    requests: {cpu: 100m, memory: 512Mi}
    limits: {cpu: "1", memory: 1Gi}

initialization:
  image: quay.io/oceanbase/mc:RELEASE.2025-08-13T08-35-41Z
  imagePullPolicy: IfNotPresent
  # Independent from minio.*; private emptyDirs can also inherit host ACLs.
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  deadlineSeconds: 600
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

logService:
  clusterId: 1001
  # Set to a registry image available to your cluster. Do not use latest.
  image: quay.io/oceanbase/logservice:1.3.3-152026112014
  resource: {cpu: "2", memory: 4Gi}
  # Test profile: 20Gi total PVC capacity per LogService (10Gi store + 10Gi logs).
  storeSize: 10Gi
  logSize: 10Gi
  storeStorageClass: "" # empty inherits storageClass
  logStorageClass: ""   # empty inherits storageClass
  topology:
    - {zone: zone1, replica: 1}
    - {zone: zone2, replica: 1}
    - {zone: zone3, replica: 1}
  parameters:
    - {name: log_level, value: INFO}

# One SQL metrics exporter per Observer.
monitor:
  enabled: true
  image: quay.io/oceanbase/obagent:4.2.6-100000152026051118
  resource: {cpu: "500m", memory: 512Mi}

observer:
  clusterId: 1002
  image: quay.io/oceanbase/oceanseek:4.6.3.0-482026112114
  resource: {cpu: "3", memory: 10Gi}
  # Test profile: 50Gi total PVC capacity (40Gi data + 10Gi logs).
  # Fresh installs only; preserve existing PVC sizes on upgrades (no shrinking).
  dataSize: 40Gi
  logSize: 10Gi
  dataStorageClass: "" # empty inherits storageClass
  logStorageClass: ""  # empty inherits storageClass
  rootExistingSecret: "" # optional key password; otherwise generated and retained
  topology:
    - {zone: zone1, replica: 1}
  parameters:
    - {name: system_memory, value: 1G}
    - {name: __min_full_resource_pool_memory, value: "2147483648"}

# Unconditional retention protects database CRs, credentials, MinIO workload,
# Service and PVC on helm uninstall/failed-install cleanup. It is NOT a backup
# and does not protect against deleting the namespace or explicit kubectl delete.

# The published Chart enables and supplies its bundled prerequisite payload.
operator:
  enabled: true
  sharedBootstrap: true
  kubeRbacProxyImage: quay.io/brancz/kube-rbac-proxy:v0.13.1

prerequisites:
  enabled: false
  image: quay.io/oceanbase/oceanbase-helper:2.4.0
  timeoutSeconds: 1800

# Reuse a compatible shared Operator. Pair with Helm --skip-crds.
skip-operator: false
