# Replace all four hostname labels before installing. Use SSD-backed StorageClasses.
# Compute worker: >=4.5 CPU/16Gi plus system and optional infrastructure overhead.
# Each LogService worker: 2 CPU/4Gi allocatable for the process, plus host overhead.
scheduling:
  nodeSelector: {kubernetes.io/hostname: worker-compute}
observer:
  resource: {cpu: "3", memory: 10Gi}
  dataSize: 40Gi
  logSize: 10Gi
  topology:
    - zone: zone1
      replica: 1
      nodeSelector: {kubernetes.io/hostname: worker-compute}
obproxy:
  enabled: true
  replicas: 1
  nodeSelector: {kubernetes.io/hostname: worker-compute}
  resources:
    requests: {cpu: "1", memory: 2Gi}
    limits: {cpu: "1", memory: 2Gi}
logService:
  resource: {cpu: "2", memory: 4Gi}
  storeSize: 10Gi
  logSize: 10Gi
  topology:
    - zone: zone1
      replica: 1
      nodeSelector: {kubernetes.io/hostname: worker-log-1}
    - zone: zone2
      replica: 1
      nodeSelector: {kubernetes.io/hostname: worker-log-2}
    - zone: zone3
      replica: 1
      nodeSelector: {kubernetes.io/hostname: worker-log-3}
dashboard:
  nodeSelector: {kubernetes.io/hostname: worker-compute}
minio:
  nodeSelector: {kubernetes.io/hostname: worker-compute}
