{{- include "lakehouse.validate" . -}}
{{- $guard := lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-storage-identity" .Release.Name) -}}
{{- $generated := dict -}}
{{- if eq .Values.objectStorage.mode "bundled" -}}
{{- if not .Values.minio.rootExistingSecret -}}
{{- $_ := set $generated (include "lakehouse.minioSecret" .) (dict "rootUser" (randAlphaNum 20) "rootPassword" (randAlphaNum 48)) -}}
{{- end -}}
{{- $_ := set $generated (include "lakehouse.storageSecret" .) (dict "access_id" (randAlphaNum 20) "access_key" (randAlphaNum 48)) -}}
{{- end -}}
{{- if not .Values.observer.rootExistingSecret -}}
{{- $_ := set $generated (include "lakehouse.dbSecret" .) (dict "password" (randAlphaNum 32)) -}}
{{- end -}}
{{- range $name, $keys := $generated -}}
{{- $existing := lookup "v1" "Secret" $.Release.Namespace $name -}}
{{- if and $guard (not $existing) }}{{ fail (printf "retained credential Secret %s is missing; restore it instead of generating new credentials" $name) }}{{ end -}}
{{ printf "\n---\n" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "lakehouse.labels" $ | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := $keys }}
  {{- if $existing }}
  {{ $key }}: {{ required (printf "Secret %s requires %s" $name $key) (index $existing.data $key) | quote }}
  {{- else }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
