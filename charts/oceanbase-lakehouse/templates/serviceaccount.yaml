apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-workload
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets: {{ toYaml . | nindent 2 }}
{{- end }}
