{{- if .Values.prerequisites.enabled }}
{{- if not (.Files.Get "files/prerequisites/operator.yaml") }}{{ fail "prerequisites.enabled requires the single-command distribution with bundled manifests" }}{{ end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-prerequisites
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
{{- with .Values.imagePullSecrets }}
imagePullSecrets: {{ toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-{{ .Release.Name }}-prerequisites
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-40"
    helm.sh/hook-delete-policy: before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-prerequisites
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-prerequisites
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-30"
    helm.sh/hook-delete-policy: before-hook-creation
data:
{{ (.Files.Glob "files/prerequisites/*").AsConfig | indent 2 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-prerequisites
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  activeDeadlineSeconds: {{ .Values.prerequisites.timeoutSeconds }}
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: {{ .Release.Name }}-prerequisites
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: prerequisites
          image: {{ .Values.prerequisites.image | quote }}
          imagePullPolicy: IfNotPresent
          command: [/bin/sh, /payload/prepare.sh]
          env:
            - name: WAIT_TIMEOUT_SECONDS
              value: {{ .Values.prerequisites.timeoutSeconds | quote }}
            - name: HOME
              value: /tmp
            - name: BOOTSTRAP_BINDING
              value: {{ printf "%s-%s-prerequisites" .Release.Namespace .Release.Name | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests: {cpu: 25m, memory: 64Mi}
            limits: {cpu: 250m, memory: 256Mi}
          volumeMounts:
            - {name: payload, mountPath: /payload, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: payload
          configMap:
            name: {{ .Release.Name }}-prerequisites
        - name: tmp
          emptyDir: {}
{{- end }}
