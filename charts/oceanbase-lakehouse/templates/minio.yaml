{{- if eq .Values.objectStorage.mode "bundled" }}
{{- if not .Values.minio.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-minio-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.minio.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
  ports:
    - {name: s3, port: 9000, targetPort: s3}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-minio
  replicas: 1
  # Image updates require an explicit, planned Pod restart.
  updateStrategy: {type: OnDelete}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: minio
    spec:
      {{- include "lakehouse.scheduling" . | nindent 6 }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.minio.runAsUser }}
        runAsGroup: {{ .Values.minio.runAsGroup }}
        fsGroup: {{ .Values.minio.fsGroup }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: minio
          image: {{ .Values.minio.image | quote }}
          imagePullPolicy: {{ .Values.minio.imagePullPolicy }}
          args: [server, /data, --console-address, ":9001"]
          env:
            - {name: HOME, value: /tmp}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: {{ include "lakehouse.minioSecret" . }}, key: rootUser}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "lakehouse.minioSecret" . }}, key: rootPassword}
            - name: MINIO_REGION_NAME
              value: {{ .Values.objectStorage.region | quote }}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            httpGet: {path: /minio/health/ready, port: s3}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ toYaml .Values.minio.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-minio-data" .Release.Name) .Values.minio.existingClaim }}
        - name: tmp
          emptyDir: {}
{{- end }}
