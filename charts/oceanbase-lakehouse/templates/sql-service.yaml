{{- if eq .Values.stage "cluster" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-sql
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "lakehouse.labels" . | nindent 4 }}
spec:
  type: {{ .Values.sqlService.type }}
  selector:
    {{- if .Values.obproxy.enabled }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: obproxy
    {{- else }}
    ref-obcluster: {{ .Release.Name }}-ob
    {{- end }}
  ports:
    - name: sql
      port: {{ .Values.sqlService.port }}
      targetPort: {{ ternary 2883 2881 .Values.obproxy.enabled }}
      protocol: TCP
      {{- $nodePort := int (include "lakehouse.sqlNodePort" .) }}
      {{- if and (eq .Values.sqlService.type "NodePort") (gt $nodePort 0) }}
      nodePort: {{ $nodePort }}
      {{- end }}
{{- end }}
