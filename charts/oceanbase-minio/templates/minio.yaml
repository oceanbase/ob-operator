{{- $distributed := eq .Values.mode "distributed" -}}
{{- $peerService := printf "%s-minio-peer" .Release.Name -}}
{{- if and (not $distributed) (not .Values.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-minio-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "obminio.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.size }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "obminio.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
  ports:
    - {name: s3, port: 9000, targetPort: s3}
---
{{- if $distributed }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $peerService }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "obminio.labels" . | nindent 4 }}
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: minio
  ports:
    - {name: s3, port: 9000, targetPort: s3}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "obminio.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: minio
---
{{- end }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-minio
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "obminio.labels" . | nindent 4 }}
spec:
  {{- if $distributed }}
  serviceName: {{ $peerService }}
  replicas: {{ .Values.distributed.replicas }}
  podManagementPolicy: Parallel
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  {{- else }}
  serviceName: {{ .Release.Name }}-minio
  replicas: 1
  {{- end }}
  # Image updates require an explicit, planned Pod restart.
  updateStrategy: {type: OnDelete}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: minio
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: minio
    spec:
      {{- include "obminio.scheduling" . | nindent 6 }}
      {{- if $distributed }}
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - topologyKey: kubernetes.io/hostname
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: {{ .Release.Name }}
                  app.kubernetes.io/component: minio
      {{- end }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.runAsUser }}
        runAsGroup: {{ .Values.runAsGroup }}
        fsGroup: {{ .Values.fsGroup }}
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: minio
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          {{- if $distributed }}
          args:
            - server
            - --console-address
            - ":9001"
            - {{ printf "http://%s-minio-{0...%d}.%s.%s.svc:9000/data" .Release.Name (sub (int .Values.distributed.replicas) 1) $peerService .Release.Namespace | quote }}
          {{- else }}
          args: [server, /data, --console-address, ":9001"]
          {{- end }}
          env:
            - {name: HOME, value: /tmp}
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef: {name: {{ include "obminio.secret" . }}, key: rootUser}
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ include "obminio.secret" . }}, key: rootPassword}
            - name: MINIO_REGION_NAME
              value: {{ .Values.region | quote }}
          ports:
            - {name: s3, containerPort: 9000}
          readinessProbe:
            httpGet: {path: {{ ternary "/minio/health/lakehouse-ready" "/minio/health/ready" $distributed }}, port: s3}
            periodSeconds: 5
            {{- if $distributed }}
            timeoutSeconds: 5
            {{- end }}
          livenessProbe:
            httpGet: {path: /minio/health/live, port: s3}
            initialDelaySeconds: 30
            periodSeconds: 10
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- if not $distributed }}
        - name: data
          persistentVolumeClaim:
            claimName: {{ default (printf "%s-minio-data" .Release.Name) .Values.existingClaim }}
        {{- end }}
        - name: tmp
          emptyDir: {}
  {{- if $distributed }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.distributed.driveSize }}
  {{- end }}
