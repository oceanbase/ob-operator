{{- if not .Values.rootExistingSecret -}}
{{- $name := include "obminio.secret" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
{{- $guard := lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-minio-identity" .Release.Name) -}}
{{- $legacy := lookup "v1" "ConfigMap" .Release.Namespace (printf "%s-storage-identity" .Release.Name) -}}
{{- $internal := printf "http://%s-minio.%s.svc:9000" .Release.Name .Release.Namespace -}}
{{- if and (not $existing) (or $guard (and $legacy (eq (index $legacy.data "endpoint") $internal))) }}{{ fail (printf "retained credential Secret %s is missing; restore it instead of generating new credentials" $name) }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- range $key, $length := dict "rootUser" 20 "rootPassword" 48 }}
  {{ $key }}: {{ if $existing }}{{ required (printf "Secret %s requires %s" $name $key) (index $existing.data $key) | quote }}{{ else }}{{ randAlphaNum (int $length) | b64enc | quote }}{{ end }}
  {{- end }}
{{- end }}
