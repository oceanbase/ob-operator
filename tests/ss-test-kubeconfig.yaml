# Deliberately unreachable, credential-free config for pure unit test package init.
# Never point unit tests at the live k3s API. Envtest supplies its own API server.
apiVersion: v1
kind: Config
clusters:
  - name: unit-test-only
    cluster:
      server: http://127.0.0.1:1
contexts:
  - name: unit-test-only
    context:
      cluster: unit-test-only
current-context: unit-test-only
